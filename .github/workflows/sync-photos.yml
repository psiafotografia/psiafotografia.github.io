name: Sync photos from Google Photos

on:
  workflow_dispatch:
    inputs:
      insert_at:
        description: Where to insert new photos in the gallery
        required: true
        default: top
        type: choice
        options:
          - top
          - bottom

permissions:
  contents: write

concurrency:
  group: photo-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync new photos
        env:
          INSERT_AT: ${{ inputs.insert_at }}
        run: python scripts/sync_photos.py --insert-at "$INSERT_AT"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- images/thumbs images/medium js/photos.json
          if git diff --cached --quiet; then
            echo "No new photos to publish."
            exit 0
          fi

          git commit -m "Sync new photos from Google Photos"
          git pull --rebase
          git push
